<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESN Designer Whey | Lychee Edition</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for Bold Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fixed Diagonal Split Background -->
    <div class="bg-wrapper">
        <div class="base-black"></div>
        <div class="pink-diagonal"></div>
    </div>

    <!-- Top Navigation (Styled after Reference 1) -->
    <header class="navbar">
        <div class="logo">ESN<span>.</span></div>
        <nav class="nav-pill">
            <a href="#features">Features</a>
            <a href="#flavors">Flavors</a>
            <a href="#nutrition">Nutrition</a>
            <a href="#brand">Brand</a>
        </nav>
        <button class="nav-btn">Order Now</button>
    </header>

    <!-- Three.js 3D WebGL Canvas -->
    <canvas id="webgl"></canvas>

    <!-- Scroll Container for Pinned GSAP ScrollTrigger -->
    <main class="scroll-container">
        
        <!-- Screen 1 Prompt: Initial Idle State -->
        <div class="scroll-indicator">
            <span>Scroll down</span>
            <div class="arrow-down">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
            </div>
        </div>

        <!-- Screen 2 Target: End Layout (Left Side Text) -->
        <section class="content-stage">
            <div class="hero-left">
                <h1 class="main-title">
                    TASTE THE<br>
                    EXOTIC SIDE<br>
                    OF PROTEIN.
                </h1>
                <p class="description">
                    Juicy lychee meets rich chocolate. Maximum protein, zero added sugar, unmatched summer flavor.
                </p>
                <div class="cta-wrapper">
                    <button class="btn-lychee">Taste the Limited Edition</button>
                </div>
            </div>

            <img src="assets/Lychees.png" class="lychee-decor" alt="Fresh Lychees">

        </section>

    </main>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="app.js"></script>
</body>
</html>
